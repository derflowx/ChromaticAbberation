name: Deploy prototypes to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'webgl-prototype/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Site layout: / = WebGPU version (web/), /webgl/ = WebGL2 prototype,
      # /compare.html = both side by side.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/webgl
          cp webgl-prototype/index.html _site/webgl/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

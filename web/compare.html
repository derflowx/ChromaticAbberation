<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CA Side by Side</title>
  <meta name="description" content="WebGPU spectral CA and the WebGL2 prototype, side by side.">
  <style>
    :root { --bg: #0c0c0e; --panel: #17171a; --text: #e4e4e7; --muted: #8b8b94; --line: #2a2a2f; --accent: #ff7a2f; color-scheme: dark; }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) { --bg: #f4f4f5; --panel: #fff; --text: #18181b; --muted: #71717a; --line: #e4e4e7; --accent: #e8590c; color-scheme: light; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; gap: 16px; align-items: baseline; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
    h1 { font-size: 15px; margin: 0; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
    main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
    section { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
    section h2 { font-size: 12px; margin: 0; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; justify-content: space-between; gap: 8px; }
    iframe { flex: 1; width: 100%; border: 0; background: #000; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-auto-rows: 85vh; } }
  </style>
</head>
<body>
  <header>
    <h1>Side by side</h1>
    <span class="muted">Each runs independently. For a fair look, load the same image in both and match settings (WebGL amount ≈ WebGPU amount × −1.54, Clean center 12%, Fringe blur 0, Highlight glow 0).</span>
  </header>
  <main>
    <section>
      <h2>WebGPU version <a href="./" target="_blank">open full</a></h2>
      <iframe src="./" title="WebGPU version"></iframe>
    </section>
    <section>
      <h2>WebGL2 prototype <a href="./webgl/" target="_blank">open full</a></h2>
      <iframe src="./webgl/" title="WebGL2 prototype"></iframe>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectral Chromatic Aberration</title>
<style>
  :root { --bg:#0e0f11; --panel:#17181c; --panel2:#1e2025; --fg:#e8e8ea; --dim:#8b8e97; --acc:#8fb0ff; --line:#2a2c33; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:12.5px/1.4 -apple-system, system-ui, sans-serif; display:flex; height:100vh; overflow:hidden; }
  #stage { flex:1; display:flex; flex-direction:column; min-width:0; }
  #toolbar { display:flex; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  #toolbar .sep { width:1px; height:20px; background:var(--line); }
  #view { flex:1; overflow:auto; position:relative; display:flex; }
  #view canvas { margin:auto; display:block; image-rendering:pixelated; cursor:crosshair; }
  #status { position:absolute; left:10px; bottom:8px; color:var(--dim); font-variant-numeric:tabular-nums; pointer-events:none; text-shadow:0 1px 2px #000; }
  #panel { width:300px; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:12px 14px 28px; }
  .seg { display:inline-flex; background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:2px; gap:2px; }
  .seg button { background:none; border:0; color:var(--dim); padding:4px 9px; border-radius:5px; cursor:pointer; font:inherit; }
  .seg button.on { background:#33363f; color:var(--fg); }
  .seg.full { display:flex; } .seg.full button { flex:1; }
  select, .btn { background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:5px 8px; font:inherit; cursor:pointer; }
  #look { width:100%; font-size:14px; padding:8px 10px; font-weight:600; }
  .sec { font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:18px 0 6px; font-weight:600; }
  .ctl { margin:9px 0; }
  .ctl .top { display:flex; justify-content:space-between; align-items:center; }
  .ctl .top label { cursor:default; user-select:none; }
  .ctl .top label:hover { color:var(--acc); }
  .ctl input[type=number] { width:64px; background:transparent; border:1px solid transparent; color:var(--dim); text-align:right; font:inherit; font-variant-numeric:tabular-nums; border-radius:5px; padding:1px 4px; }
  .ctl input[type=number]:hover, .ctl input[type=number]:focus { border-color:var(--line); color:var(--fg); outline:none; }
  .ctl.over input[type=number] { color:#ffb86b; }
  .ctl .unit { color:var(--dim); margin-left:2px; }
  input[type=range] { width:100%; accent-color:var(--acc); margin:3px 0 0; }
  .ctl.over input[type=range] { accent-color:#ffb86b; }
  .hint { color:var(--dim); font-size:11.5px; margin:4px 0; }
  .colors { display:flex; gap:8px; margin:8px 0; align-items:center; }
  .colors input[type=color] { width:44px; height:26px; border:1px solid var(--line); border-radius:6px; background:none; padding:0; cursor:pointer; }
  details { border-top:1px solid var(--line); margin-top:16px; padding-top:4px; }
  summary { cursor:pointer; padding:8px 0 4px; font-weight:600; list-style:none; display:flex; justify-content:space-between; }
  summary::after { content:'+'; color:var(--dim); } details[open] summary::after { content:'–'; }
  .check { display:flex; align-items:center; gap:6px; margin:6px 0; }
  .row2 { display:flex; gap:6px; margin:6px 0; } .row2 > * { flex:1; }
  #plot { width:100%; height:80px; display:block; background:#111216; border-radius:6px; margin:6px 0 2px; }
  #drop { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:#000a; font-size:18px; }
  .hidden { display:none !important; }
  @media (max-width:760px){ body{flex-direction:column; height:auto; overflow:auto;} #panel{width:100%;} #view{height:60vh;} }
</style>
</head>
<body>
<div id="stage">
  <div id="toolbar">
    <div class="seg" id="compare"><button data-v="before">Before</button><button data-v="after" class="on">After</button><button data-v="split">Split</button></div>
    <div class="seg" id="viewmode"><button data-v="0" class="on">Image</button><button data-v="1">Blur map</button><button data-v="2">Depth</button></div>
    <div class="sep"></div>
    <select id="source"><option value="scene">3D scene (HDR + depth)</option><option value="test">Test pattern</option><option value="branches">Branches</option><option value="open">Open image…</option></select>
    <select id="zoom"><option value="fit">Fit</option><option value="1">100%</option><option value="2">200%</option><option value="4">400%</option></select>
    <select id="quality"><option value="draft">Draft</option><option value="good" selected>Good</option><option value="final">Final</option></select>
    <button class="btn" id="save">Save PNG</button>
    <input type="file" id="file" accept="image/*" class="hidden">
  </div>
  <div id="view"><canvas id="c"></canvas><div id="status"></div><div id="drop">Drop image</div></div>
</div>

<div id="panel">
  <select id="look"></select>
  <div class="hint">Double-click a label to reset it. Type any value into a number field to go past the slider's range.</div>

  <div id="g-main"></div>
  <div class="hint">Shift-click the image to set the lens center. <a href="#" id="resetCenter" style="color:var(--acc)">Recenter</a></div>

  <div class="sec">Fringe colors</div>
  <div class="seg full" id="palette"><button data-v="0" class="on">Natural</button><button data-v="1">Shifted</button><button data-v="2">Two-color</button></div>
  <div id="g-hue"></div>
  <div class="colors hidden" id="twocolor"><input type="color" id="colA" value="#00e5ff"><span class="hint">→</span><input type="color" id="colB" value="#ff2bd6"><span class="hint">inner → outer</span></div>
  <div id="g-color"></div>

  <details id="depthSec">
    <summary>Depth &amp; bokeh</summary>
    <div class="hint" id="depthState"></div>
    <div class="row2"><button class="btn" id="loadDepth">Load depth map…</button><button class="btn" id="clearDepth">Remove</button></div>
    <input type="file" id="depthFile" accept="image/*" class="hidden">
    <div id="byteDepth" class="hidden">
      <label class="check"><input type="checkbox" id="depthInvert" checked> White = near</label>
      <div id="g-range"></div>
    </div>
    <div class="hint">Alt/Option-click the image to focus there.</div>
    <div id="g-dof"></div>
  </details>

  <details>
    <summary>Lens physics</summary>
    <select id="glass" style="width:100%"></select>
    <canvas id="plot" width="540" height="160"></canvas>
    <div class="hint" id="glassInfo"></div>
    <div id="g-phys"></div>
    <label class="check"><input type="checkbox" id="cheap"> Compare against cheap RGB split</label>
  </details>
</div>

<script>
// =====================================================================
//  Controls: slider + typeable number (overcrank), double-click to reset
// =====================================================================
const val = {}, ctl = {};
function control(host, o){
  const {id,label,min,max,step,def,unit='',hard=[-Infinity,Infinity],disp=v=>v,undisp=v=>v,decimals=1} = o;
  const el = document.createElement('div'); el.className='ctl'; el.id='ctl-'+id;
  el.innerHTML = `<div class="top"><label>${label}</label><span><input type="number" step="any"><span class="unit">${unit}</span></span></div><input type="range" min="${min}" max="${max}" step="${step}">`;
  document.getElementById(host).appendChild(el);
  const num = el.querySelector('input[type=number]'), rng = el.querySelector('input[type=range]');
  const set = (v, silent) => {
    v = Math.min(hard[1], Math.max(hard[0], v)); val[id] = v;
    rng.value = v; num.value = (+disp(v).toFixed(decimals));
    el.classList.toggle('over', v>max || v<min);
    if(!silent) onParam(id);
  };
  rng.addEventListener('input', () => set(+rng.value));
  num.addEventListener('change', () => { const x=parseFloat(num.value); if(isFinite(x)) set(undisp(x)); else set(val[id]); });
  el.querySelector('label').addEventListener('dblclick', () => set(def));
  ctl[id] = { set, def }; set(def, true);
}
const pct = {disp:v=>v*100, undisp:v=>v/100, unit:'%', decimals:0};

control('g-main',{id:'amount', label:'Amount', min:-40, max:40, step:0.1, def:8, unit:'px'});
control('g-main',{id:'blur', label:'Fringe blur', min:0, max:30, step:0.1, def:3, unit:'px', hard:[0,Infinity]});
control('g-main',{id:'preserve', label:'Preserve detail (luma)', min:0, max:1, step:0.01, def:0, hard:[0,1], ...pct});
control('g-main',{id:'streak', label:'Blur shape: round → streak', min:0, max:1, step:0.01, def:0, hard:[0,1], ...pct});
control('g-main',{id:'clean', label:'Clean center', min:0, max:1, step:0.01, def:0.3, hard:[0,1.5], ...pct});
control('g-main',{id:'glow', label:'Highlight glow', min:0, max:0.95, step:0.01, def:0.6, hard:[0,0.98], ...pct});
control('g-main',{id:'mix', label:'Mix', min:0, max:1, step:0.01, def:1, hard:[0,2], ...pct});
control('g-hue',{id:'hue', label:'Hue shift', min:-180, max:180, step:1, def:0, unit:'°', decimals:0});
control('g-color',{id:'sat', label:'Color intensity', min:0, max:2, step:0.01, def:1, hard:[0,Infinity], ...pct});
control('g-range',{id:'near', label:'Near', min:0.1, max:20, step:0.1, def:1, unit:'m', hard:[0.01,1e4]});
control('g-range',{id:'far', label:'Far', min:1, max:500, step:1, def:60, unit:'m', hard:[0.02,1e5], decimals:0});
const focusFromSlider = v => 0.2*Math.pow(1000, v/1000), sliderFromFocus = d => 1000*Math.log(d/0.2)/Math.log(1000);
control('g-dof',{id:'focus', label:'Focus distance', min:0, max:1000, step:1, def:450, unit:'m', disp:focusFromSlider, undisp:sliderFromFocus, decimals:2});
control('g-dof',{id:'bokeh', label:'Bokeh size', min:0, max:60, step:0.1, def:14, unit:'px', hard:[0,Infinity]});
control('g-dof',{id:'blades', label:'Aperture blades (0 = round)', min:0, max:12, step:1, def:0, hard:[0,32], decimals:0});
control('g-dof',{id:'bladeRot', label:'Blade rotation', min:0, max:180, step:1, def:15, unit:'°', decimals:0});
control('g-dof',{id:'catEye', label:'Cat-eye toward edges', min:0, max:1, step:0.01, def:0.4, hard:[0,1.2], ...pct});
control('g-dof',{id:'rim', label:'Bokeh rim: soft ↔ ring', min:-1, max:1, step:0.01, def:0.35, hard:[-1,1], ...pct});
control('g-phys',{id:'secondary', label:'Custom curve: linear → secondary', min:0, max:1, step:0.01, def:0.35, hard:[0,1], ...pct});
control('g-phys',{id:'focusLambda', label:'Sharpest wavelength', min:420, max:680, step:1, def:550, unit:'nm', hard:[400,700], decimals:0});
control('g-phys',{id:'falloffBase', label:'Falloff exponent offset', min:-1, max:1, step:0.01, def:0, decimals:2});
control('g-phys',{id:'sphChroma', label:'Spherochromatism', min:-1, max:1, step:0.01, def:0.4, hard:[-1,1], ...pct});
control('g-phys',{id:'maxBlur', label:'Max depth blur', min:8, max:256, step:1, def:96, unit:'px', hard:[1,256], decimals:0});

// =====================================================================
//  Glass models (Sellmeier) → dispersion LUT
// =====================================================================
const GLASS = {
  'N-BK7':  [1.03961212,0.231792344,1.01046945, 0.00600069867,0.0200179144,103.560653],
  'F2':     [1.34533359,0.209073176,0.937357162, 0.00997743871,0.0470450767,111.886764],
  'N-SF11': [1.73759695,0.313747346,1.89878101, 0.013188707,0.0623068142,155.23629],
  'CaF2':   [0.5675888,0.4710914,3.8484723, 0.00252643,0.0100783,1200.556],
  'Silica': [0.6961663,0.4079426,0.8974794, 0.00467914826,0.0135120631,97.9340025],
};
const nIdx = (g,nm) => { const [B1,B2,B3,C1,C2,C3]=GLASS[g], l2=(nm/1000)**2; return Math.sqrt(1+B1*l2/(l2-C1)+B2*l2/(l2-C2)+B3*l2/(l2-C3)); };
function solve(A,b){ const n=b.length, M=A.map((r,i)=>[...r,b[i]]);
  for(let i=0;i<n;i++){ let p=i; for(let k=i+1;k<n;k++) if(Math.abs(M[k][i])>Math.abs(M[p][i])) p=k; [M[i],M[p]]=[M[p],M[i]];
    for(let k=0;k<n;k++) if(k!==i){ const f=M[k][i]/M[i][i]; for(let j=i;j<=n;j++) M[k][j]-=f*M[i][j]; } }
  return M.map((r,i)=>r[n]/r[i]); }
function lensPower(glasses){ const F=486.1, d=587.6, C=656.3; let K;
  if(glasses.length===1) K=[1/(nIdx(glasses[0],d)-1)];
  else if(glasses.length===2) K=solve([glasses.map(g=>nIdx(g,F)-nIdx(g,C)), glasses.map(g=>nIdx(g,d)-1)],[0,1]);
  else K=solve([F,d,C].map(l=>glasses.map(g=>nIdx(g,l)-1)),[1,1,1]);
  return nm => glasses.reduce((s,g,i)=>s+(nIdx(g,nm)-1)*K[i],0); }
const GLASSES = {
  custom: {name:'Custom curve'},
  bk7:    {name:'Single lens · crown glass', g:['N-BK7'], info:'Uncorrected: red/blue fringes.'},
  sf11:   {name:'Single lens · dense flint', g:['N-SF11'], info:'High dispersion, violet-heavy.'},
  silica: {name:'Single lens · fused silica', g:['Silica'], info:'Low dispersion.'},
  achro:  {name:'Achromat doublet', g:['N-BK7','F2'], info:'Red+blue share focus, green left over → green/magenta fringes.'},
  achroSF:{name:'Achromat doublet · dense flint', g:['N-BK7','N-SF11'], info:'Different secondary-spectrum shape.'},
  apo:    {name:'Apochromat triplet', g:['CaF2','N-BK7','F2'], info:'Tiny, wavy residual.'},
};
const gsel = document.getElementById('glass');
for (const [k,p] of Object.entries(GLASSES)) gsel.add(new Option(p.name,k));
gsel.value='achro';
const LUTN=64; const LUT=new Float32Array(LUTN); let axSpan=2;
function lutAt(t){ const x=Math.min(Math.max(t*0.5+0.5,0),1)*(LUTN-1), i=Math.min(Math.floor(x),LUTN-2); return LUT[i]+(LUT[i+1]-LUT[i])*(x-i); }
function buildLUT(){
  const p=GLASSES[gsel.value], raw=new Float32Array(LUTN);
  if(!p.g){ const s=val.secondary; for(let k=0;k<LUTN;k++){ const t=k/(LUTN-1)*2-1; raw[k]=(1-s)*t+s*(1.5*t*t-0.5); } }
  else { const phi=lensPower(p.g), p0=phi(550); for(let k=0;k<LUTN;k++) raw[k]=p0/phi(400+300*k/(LUTN-1))-1; }
  const ref=raw[Math.round((LUTN-1)/2)]; let m=0;
  for(let k=0;k<LUTN;k++){ raw[k]-=ref; m=Math.max(m,Math.abs(raw[k])); }
  for(let k=0;k<LUTN;k++) LUT[k]=raw[k]/(m||1);
  const dF=lutAt((val.focusLambda-550)/150); axSpan=Math.max(...Array.from(LUT,d=>Math.abs(d-dF)));
  document.getElementById('ctl-secondary').classList.toggle('hidden', !!p.g);
  document.getElementById('glassInfo').textContent = p.info || 'Blend between plain glass (linear) and achromat-style secondary spectrum.';
  drawPlot();
}
function drawPlot(){
  const c=document.getElementById('plot'), x=c.getContext('2d'), W=c.width, H=c.height;
  x.clearRect(0,0,W,H); x.strokeStyle='#2a2c33'; x.beginPath(); x.moveTo(0,H/2); x.lineTo(W,H/2); x.stroke();
  for(let k=0;k<LUTN-1;k++){ const t=k/(LUTN-1); x.strokeStyle=`hsl(${270*(1-t)},90%,58%)`; x.lineWidth=4; x.beginPath();
    x.moveTo(t*W, H/2-LUT[k]*H*0.4); x.lineTo((k+1)/(LUTN-1)*W, H/2-LUT[k+1]*H*0.4); x.stroke(); }
  const fx=(val.focusLambda-400)/300*W; x.strokeStyle='#fff8'; x.setLineDash([4,4]); x.lineWidth=1.5; x.beginPath(); x.moveTo(fx,0); x.lineTo(fx,H); x.stroke(); x.setLineDash([]);
}

// =====================================================================
//  Looks: one-click starting points
// =====================================================================
const LOOKS = {
  subtle:    {name:'Subtle modern lens', glass:'achro', amount:3,  blur:1,  streak:0,   clean:0.6,  glow:0.4,  sat:1,   palette:0},
  vintage:   {name:'Vintage glass',      glass:'bk7',   amount:9,  blur:4,  streak:0,   clean:0.35, glow:0.6,  sat:1.1, palette:0},
  zoom:      {name:'Cheap zoom lens',    glass:'sf11',  amount:14, blur:2,  streak:0.2, clean:0.1,  glow:0.5,  sat:1,   palette:0},
  dreamy:    {name:'Dreamy bloom',       glass:'achro', amount:6,  blur:20, preserve:0.35, streak:0,   clean:0.3,  glow:0.85, sat:0.85,palette:0},
  prism:     {name:'Prism streak',       glass:'bk7',   amount:28, blur:14, streak:0.9, clean:0.2,  glow:0.75, sat:1.4, palette:0},
  cyber:     {name:'Cyber split',        glass:'custom',secondary:0, amount:16, blur:3, streak:0.3, clean:0.25, glow:0.6, sat:1.5, palette:2, colA:'#00e5ff', colB:'#ff2bd6'},
  heat:      {name:'Warm / teal',        glass:'achro', amount:10, blur:6,  streak:0.2, clean:0.3,  glow:0.7,  sat:1.3, palette:1, hue:35},
  overcrank: {name:'Overcranked',        glass:'sf11',  amount:70, blur:60, preserve:0.7, streak:0.4, clean:0.05, glow:0.85, sat:1.8, palette:0},
};
const lsel=document.getElementById('look');
for(const [k,l] of Object.entries(LOOKS)) lsel.add(new Option(l.name,k));
lsel.add(new Option('Custom','custom'));
lsel.value='vintage';
let applyingLook=false;
function applyLook(k){
  const l=LOOKS[k]; if(!l) return; applyingLook=true;
  gsel.value=l.glass;
  for(const p of ['amount','blur','preserve','streak','clean','glow','sat','secondary','hue']) ctl[p].set(l[p] ?? ctl[p].def, true);
  if(l.colA){ document.getElementById('colA').value=l.colA; document.getElementById('colB').value=l.colB; }
  setPalette(l.palette); buildLUT(); applyingLook=false; markDirty();
}

// =====================================================================
//  GL
// =====================================================================
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true, antialias:false});
if(!gl || !gl.getExtension('EXT_color_buffer_float')){ document.body.innerHTML='<p style="padding:20px">Needs WebGL2 with EXT_color_buffer_float.</p>'; throw 0; }
const VS=`#version 300 es
in vec2 p; void main(){ gl_Position=vec4(p,0,1); }`;

const COMMON=`#version 300 es
precision highp float; precision highp int;
uniform sampler2D uDepth; uniform vec2 uSize; uniform int uDepthMode; uniform bool uDepthInvert;
uniform float uNear, uFar, uFocusDist, uAperture, uMaxCoC;
float depthAt(vec2 p){
  if(uDepthMode==0) return uFocusDist;
  ivec2 ts=textureSize(uDepth,0); ivec2 ip=clamp(ivec2(p/uSize*vec2(ts)),ivec2(0),ts-1);
  float v=texelFetch(uDepth,ip,0).r;
  if(uDepthMode==1){ if(uDepthInvert) v=1.0-v; return mix(uNear,uFar,v); }
  return v;
}
float cocOf(float z){ if(uDepthMode==0) return 0.0; return clamp(uAperture*(1.0-uFocusDist/max(z,1e-3)),-uMaxCoC,uMaxCoC); }
`;

const FS_SCENE=`#version 300 es
precision highp float;
uniform vec2 uSize;
layout(location=0) out vec4 oCol; layout(location=1) out vec4 oDep;
const int NS=6;
const vec4 SPH[NS]=vec4[](vec4(-0.55,0.32,-2.4,0.32),vec4(0.55,0.5,-5.0,0.5),vec4(-1.6,0.8,-9.0,0.8),vec4(2.6,1.0,-14.0,1.0),vec4(-4.5,1.6,-26.0,1.6),vec4(6.0,2.5,-40.0,2.5));
const vec3 ALB[NS]=vec3[](vec3(.8,.08,.06),vec3(.85),vec3(.08,.2,.8),vec3(.9,.7,.1),vec3(.5),vec3(.2,.6,.25));
const vec3 SUN=vec3(0.3226,0.2028,-0.9246);
const int NL=14;
vec3 lightPos(int i){ float f=float(i); if(i<3) return vec3(-0.6+f*0.6,0.85,-1.3); return vec3(-7.0+(f-3.0)*1.3,2.4+0.5*sin(f*1.7),-18.0-(f-3.0)*2.2); }
vec3 lightCol(int i){ return (i<3?0.12:1.0)*mix(vec3(40.,22.,8.),vec3(12.,25.,50.),fract(float(i)*0.37)); }
float hitS(vec3 ro,vec3 rd,vec4 s){ vec3 oc=ro-s.xyz; float b=dot(oc,rd),c=dot(oc,oc)-s.w*s.w,h=b*b-c; if(h<0.0) return -1.0; h=sqrt(h); float t=-b-h; if(t>1e-3) return t; t=-b+h; return t>1e-3?t:-1.0; }
vec3 sky(vec3 rd){ float y=max(rd.y,0.0); vec3 c=mix(vec3(1.1,0.75,0.5),vec3(0.06,0.09,0.2),pow(y,0.4)); float s=dot(rd,SUN);
  return c+vec3(60.,40.,20.)*smoothstep(0.9993,0.9996,s)+vec3(1.6,0.8,0.35)*pow(max(s,0.0),48.0); }
bool shadow(vec3 p){ for(int i=0;i<NS;i++) if(hitS(p,SUN,SPH[i])>0.0) return true; return false; }
void trace(vec3 ro,vec3 rd,out vec3 col,out float t){
  t=1e4; col=sky(rd); int id=-1;
  if(rd.y<0.0){ float tg=-ro.y/rd.y; if(tg<t){t=tg;id=100;} }
  for(int i=0;i<NS;i++){ float ts=hitS(ro,rd,SPH[i]); if(ts>0.0&&ts<t){t=ts;id=i;} }
  if(rd.z<0.0){ float tb=(-6.5-ro.z)/rd.z; vec3 p=ro+rd*tb; if(tb<t&&p.x>-3.4&&p.x<-1.6&&p.y>0.2&&p.y<1.8){t=tb;id=200;} }

  chk(40,40); chk(W-264,40); chk(40,H-264); chk(W-264,H-264);
  x.fillStyle='#fff'; x.fillRect(W/2-420,H-170,840,110); x.fillStyle='#000'; x.font='bold 64px Helvetica, Arial'; x.textAlign='center'; x.fillText('Black on white',W/2,H-92);
  x.fillStyle='#fff'; x.fillText('White on black',W/2,120);
  for(let i=0;i<14;i++){ const a=i/14*Math.PI*2; x.beginPath(); x.arc(W/2+Math.cos(a)*688,H/2+Math.sin(a)*430,4,0,7); x.fill(); }
  for(let i=0;i<16;i++){ const v=Math.round(i/15*255); x.fillStyle=`rgb(${v},${v},${v})`; x.fillRect(W/2-480+i*60,H/2+170,60,60); }
  return c; }
function branches(){ const W=1920,H=1080,c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const gr=x.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#fbfdff'); gr.addColorStop(1,'#dfe9f5'); x.fillStyle=gr; x.fillRect(0,0,W,H);
  let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647); x.strokeStyle='#1b1712'; x.lineCap='round';
  const br=(px,py,a,len,w,d)=>{ if(d>10||w<0.6) return; const nx=px+Math.cos(a)*len, ny=py+Math.sin(a)*len; x.lineWidth=w; x.beginPath(); x.moveTo(px,py); x.lineTo(nx,ny); x.stroke();
    br(nx,ny,a-0.25-rnd()*0.5,len*(0.7+rnd()*0.15),w*0.7,d+1); br(nx,ny,a+0.25+rnd()*0.5,len*(0.7+rnd()*0.15),w*0.7,d+1); };
  br(-40,H+40,-1.0,330,38,0); br(W+40,H+20,-2.2,300,34,0); br(W*0.5,H+60,-1.6,260,30,0); return c; }

// ---------- UI wiring ----------
function seg(id,fn){ document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{ document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle('on',x===b)); fn(b.dataset.v); markDirty(); }); }
seg('compare',v=>S.compare=v); seg('viewmode',v=>S.view=+v); seg('palette',v=>{ setPalette(+v); if(!applyingLook) lsel.value='custom'; });
function setPalette(v){ S.palette=v; document.querySelectorAll('#palette button').forEach(b=>b.classList.toggle('on',+b.dataset.v===v));
  document.getElementById('g-hue').classList.toggle('hidden',v!==1); document.getElementById('twocolor').classList.toggle('hidden',v!==2); }
['colA','colB'].forEach(id=>document.getElementById(id).oninput=()=>{ lsel.value='custom'; markDirty(); });
['depthInvert','cheap','quality'].forEach(id=>document.getElementById(id).onchange=markDirty);
lsel.onchange=()=>applyLook(lsel.value);
gsel.onchange=()=>{ buildLUT(); lsel.value='custom'; markDirty(); };
document.getElementById('resetCenter').onclick=e=>{ e.preventDefault(); S.center=[0.5,0.5]; markDirty(); };
function applyZoom(){ const z=document.getElementById('zoom').value, view=document.getElementById('view');
  if(z==='fit'){ const s=Math.min((view.clientWidth-16)/S.W,(view.clientHeight-16)/S.H); cv.style.width=S.W*s+'px'; cv.style.height=S.H*s+'px'; }
  else { cv.style.width=S.W*z/devicePixelRatio+'px'; cv.style.height=S.H*z/devicePixelRatio+'px'; } }
document.getElementById('zoom').onchange=applyZoom; addEventListener('resize',applyZoom);
let dragging=false;
const uv=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]; };
cv.addEventListener('pointerdown',e=>{ const [u,v]=uv(e);
  if(e.shiftKey){ S.center=[u,v]; markDirty(); }
  else if(e.altKey){ const z=readDepth(u,v); if(z!=null){ ctl.focus.set(Math.max(0,Math.min(1000,sliderFromFocus(Math.min(z,200))))); } }
  else if(S.compare==='split'){ dragging=true; S.split=u; markDirty(); cv.setPointerCapture(e.pointerId); } });
cv.addEventListener('pointermove',e=>{ if(dragging){ S.split=Math.min(1,Math.max(0,uv(e)[0])); markDirty(); } });
cv.addEventListener('pointerup',()=>dragging=false);
const srcSel=document.getElementById('source'); let lastSrc='scene';
srcSel.onchange=()=>{ const v=srcSel.value; if(v==='open'){ srcSel.value=lastSrc; document.getElementById('file').click(); return; }
  if(v==='shared'){ srcSel.value=lastSrc; return; }
  lastSrc=v; if(v==='scene') setSceneSource(); else setImageSource(v==='test'?testPattern():branches()); };
function loadImg(f,cb){ if(!f) return; const img=new Image(); img.onload=()=>cb(img); img.src=URL.createObjectURL(f); }
document.getElementById('file').onchange=e=>loadImg(e.target.files[0],setImageSource);
document.getElementById('loadDepth').onclick=()=>document.getElementById('depthFile').click();
document.getElementById('depthFile').onchange=e=>loadImg(e.target.files[0],setDepthImage);
document.getElementById('clearDepth').onclick=()=>{ clearDepth(); markDirty(); };
document.getElementById('save').onclick=()=>cv.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='chromatic-aberration.png'; a.click(); });
const drop=document.getElementById('drop');
addEventListener('dragover',e=>{ e.preventDefault(); drop.style.display='flex'; });
addEventListener('dragleave',e=>{ if(e.target===drop) drop.style.display='none'; });
addEventListener('drop',e=>{ e.preventDefault(); drop.style.display='none'; loadImg(e.dataTransfer.files[0],setImageSource); });

setPalette(0); applyLook('vintage'); setSceneSource();

// ---------- bridge for compare.html (same-origin parent pushes image / settings) ----------
function applySettings(v){
  applyingLook=true;
  for(const k of Object.keys(ctl)) if(typeof v[k]==='number' && isFinite(v[k])) ctl[k].set(v[k], true);
  if(v.glass in GLASSES) gsel.value=v.glass;
  if(Number.isInteger(v.palette)) setPalette(v.palette);
  if(v.quality in QUALITY) document.getElementById('quality').value=v.quality;
  if(Array.isArray(v.center)) S.center=v.center.slice(0,2).map(Number);
  if(typeof v.cheap==='boolean') document.getElementById('cheap').checked=v.cheap;
  buildLUT(); lsel.value='custom'; applyingLook=false; markDirty();
}
addEventListener('message',e=>{
  if(e.origin!==location.origin || !e.data || typeof e.data!=='object') return;
  if(e.data.type==='ca-image' && e.data.blob instanceof Blob){
    loadImg(e.data.blob, img=>{ setImageSource(img); URL.revokeObjectURL(img.src); });
    let o=[...srcSel.options].find(x=>x.value==='shared'); if(!o){ o=new Option('Shared image','shared'); srcSel.add(o,0); }
    srcSel.value=lastSrc='shared';
  } else if(e.data.type==='ca-set') applySettings(e.data.values||{});
  else if(e.data.type==='ca-hello') announce();
});
function announce(){ if(parent!==window) parent.postMessage({type:'ca-ready', app:'webgl'}, location.origin); }
announce();
</script>
